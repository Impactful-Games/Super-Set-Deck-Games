[versions]
asciidoctorj = "3.0.1"                  # https://github.com/asciidoctor/asciidoctorj/releases
compose-material3 = "1.12.0-alpha03"    # https://github.com/JetBrains/compose-multiplatform/releases
compose-multiplatform = "1.12.2"        # https://github.com/JetBrains/compose-multiplatform/releases
coroutines = "1.11.0"                   # https://github.com/Kotlin/kotlinx.coroutines/releases
jsoup = "1.24.1"                        # https://github.com/jhy/jsoup/releases
kotlin = "2.4.21"                       # https://kotlinlang.org/docs/releases.html#release-history
kotlinx-browser = "0.5.0"               # https://github.com/Kotlin/kotlinx-browser/releases
qrose = "1.3.1"                         # https://github.com/alexzhirkevich/qrose/releases
serialization = "1.12.0"                # https://github.com/Kotlin/kotlinx.serialization/releases
snakeyaml-engine = "3.2"                # https://bitbucket.org/snakeyaml/snakeyaml-engine/wiki/Changes

[plugins]
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
asciidoctorj = { module = "org.asciidoctor:asciidoctorj", version.ref = "asciidoctorj" }

compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }

jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinx-browser" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }

snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml-engine" }
