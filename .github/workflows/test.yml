name: check

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.adoc'
      - '**/.gitignore'
  workflow_dispatch:

jobs:

  check:
    # macOS: designcraft-cli, which exports the boards and the game aids, is only released for macOS.
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up JDK Temurin 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up DesignCraft
        uses: ./.github/actions/setup-designcraft
        with:
          fonts-passphrase: ${{ secrets.FONTS_PASSPHRASE }}
      # BoardGameGeek answers are kept between runs: the API is only called for new games.
      - name: Cache BoardGameGeek data
        uses: actions/cache@v4
        with:
          path: build/bgg-cache
          key: bgg-${{ hashFiles('games/*/game.yaml') }}
          restore-keys: bgg-
      - name: Build
        run: ./gradlew --stacktrace --scan build
        shell: bash
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
