name: Set up DesignCraft
description: Installs designcraft-cli and the fonts of the design files (font/), which the build needs to export the boards and the game aids. macOS only.

runs:
  using: composite
  steps:
    - name: Install designcraft-cli
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: "0.20.1"
      run: |
        gh release download "v$VERSION" --repo storytold/designcraft --pattern "designcraft-cli-$VERSION-macos-universal.zip" --dir "$RUNNER_TEMP"
        unzip -q "$RUNNER_TEMP/designcraft-cli-$VERSION-macos-universal.zip" -d "$RUNNER_TEMP"
        echo "DESIGNCRAFT_CLI=$RUNNER_TEMP/designcraft-cli-$VERSION-macos-universal/designcraft-cli" >> "$GITHUB_ENV"
    - name: Install the fonts
      shell: bash
      run: |
        mkdir -p ~/Library/Fonts
        cp "$GITHUB_WORKSPACE"/font/*.ttf ~/Library/Fonts/
